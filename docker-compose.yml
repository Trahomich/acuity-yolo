services:
  worker:
    # Образ тегируется как worker:<device>-<model>. Переключение железа — DEVICE,
    # переключение модели — MODEL (m/l/x). Оба — без пересборки, через pull.
    #   ghcr.io/trahomich/acuity-yolo/worker:gpu-amd-m  (по умолчанию)
    #   ghcr.io/trahomich/acuity-yolo/worker:gpu-amd-l
    #   ghcr.io/trahomich/acuity-yolo/worker:cpu-x  и т.д.
    image: ghcr.io/trahomich/acuity-yolo/worker:${DEVICE:-gpu-amd}-${MODEL:-m}
    container_name: acuity-yolo-worker
    pull_policy: always
    restart: unless-stopped
    environment:
      # EXECUTION_PROVIDER по умолчанию выводится из DEVICE (cpu→cpu, gpu-amd→rocm).
      # Можно переопределить явно в .env.
      EXECUTION_PROVIDER: ${EXECUTION_PROVIDER:-${GPU_EP:-rocm}}
      CONF_THRESHOLD: ${CONF_THRESHOLD:-0.4}
      IOU_THRESHOLD: ${IOU_THRESHOLD:-0.5}
      INPUT_SIZE: ${INPUT_SIZE:-640}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      MODEL_NAME: ${MODEL_NAME:-yolov12m}
      MODEL_PATH: ${MODEL_PATH:-models/yolov12m.onnx}
      # Число uvicorn-воркеров (параллельный инференс). Каждый грузит свою копию
      # модели в RAM — поднимать с учётом лимита памяти контейнера.
      UVICORN_WORKERS: ${UVICORN_WORKERS:-1}
      # ── Удалённое логирование в VictoriaLogs (OTLP HTTP). ──
      # Пусто → только stderr. Задайте URL для дублирования всех логов
      # (с extra-полями как OTLP attributes) в централизованный storage.
      VICTORIALOGS_URL: ${VICTORIALOGS_URL:-}
      LOG_SERVICE_NAME: ${LOG_SERVICE_NAME:-acuity-yolo}
    ports:
      - "${WORKER_HTTP_PORT:-9104}:8000"
    # ── AMD GPU (ROCm). Нужен только для DEVICE=gpu-amd. ──
    # Для чисто-CPU деплоя (DEVICE=cpu) ЗАКОММЕНТИРУЙТЕ этот блок целиком —
    # на хосте без GPU Docker откажется стартовать контейнер (no such device).
    devices:
      - /dev/kfd
      - /dev/dri
    group_add:
      - "${RENDER_GID:-992}"
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz').status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: ${WORKER_MEMORY:-4g}

  # Опциональный redis для будущего кеша/очереди (тираж 2). Не используется
  # воркером в тираже 1 — можно убрать. Запуск отдельной командой:
  #   docker compose up redis
  redis:
    image: redis:7-alpine
    container_name: acuity-yolo-redis
    restart: unless-stopped
    volumes:
      - redis-data:/data

volumes:
  redis-data:
