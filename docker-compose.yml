services:
  worker:
    image: ghcr.io/trahomich/acuity-yolo/worker:${DEVICE:-cpu}
    container_name: acuity-yolo-worker
    pull_policy: always
    restart: unless-stopped
    environment:
      EXECUTION_PROVIDER: ${EXECUTION_PROVIDER:-${DEVICE:-cpu}}
      CONF_THRESHOLD: ${CONF_THRESHOLD:-0.4}
      IOU_THRESHOLD: ${IOU_THRESHOLD:-0.5}
      INPUT_SIZE: ${INPUT_SIZE:-640}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      MODEL_NAME: ${MODEL_NAME:-yolov12n}
      MODEL_PATH: ${MODEL_PATH:-models/yolov12n.onnx}
    ports:
      - "${WORKER_HTTP_PORT:-9104}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz').status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: ${WORKER_MEMORY:-2g}

  worker-gpu:
    image: ghcr.io/trahomich/acuity-yolo/worker:${DEVICE:-rocm}
    container_name: acuity-yolo-worker
    pull_policy: always
    restart: unless-stopped
    profiles: ["gpu"]
    environment:
      EXECUTION_PROVIDER: rocm
      CONF_THRESHOLD: ${CONF_THRESHOLD:-0.4}
      IOU_THRESHOLD: ${IOU_THRESHOLD:-0.5}
      INPUT_SIZE: ${INPUT_SIZE:-640}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      MODEL_NAME: ${MODEL_NAME:-yolov12n}
      MODEL_PATH: ${MODEL_PATH:-models/yolov12n.onnx}
    ports:
      - "${WORKER_HTTP_PORT:-9104}:8000"
    devices:
      - /dev/kfd
      - /dev/dri
    group_add:
      - "${RENDER_GID:-992}"
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined
    volumes:
      - /opt/rocm:/opt/rocm:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz').status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: ${WORKER_MEMORY:-4g}

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: acuity-yolo-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - worker

  redis:
    image: redis:7-alpine
    container_name: acuity-yolo-redis
    restart: unless-stopped
    profiles: ["with-redis"]
    volumes:
      - redis-data:/data

volumes:
  redis-data:
