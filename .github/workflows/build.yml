# .github/workflows/build.yml
#
# Сборка и публикация Docker-образов в GHCR (GitHub Container Registry).
# На каждый push в main собираются оба варианта:
#   - ghcr.io/trahomich/acuity-yolo/worker:cpu      (onnxruntime, CPU-only)
#   - ghcr.io/trahomich/acuity-yolo/worker:rocm     (onnxruntime-rocm, AMD GPU)
#
# Образы публичные (чтобы сервер мог тянуть без docker login). Если нужно
# закрыть — в GitHub: репо → Packages → worker → Settings → Change visibility.
#
# Тегирование:
#   push в main     → worker:cpu / worker:rocm (rolling)
#   тег v*.*.*      → worker:cpu:<tag> / worker:rocm:<tag> + :<tag>
#   pull_request    → сборка без пуша (smoke-тест)
name: build

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/worker

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        device: [cpu, rocm]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}
          # Доп. тег с суффиксом устройства, чтобы cpu и rocm жили раздельно.
          # main → worker:cpu / worker:rocm;  v1.2.3 → worker:cpu:1.2.3
          flavor: |
            latest=false
            suffix=-${{ matrix.device }},onlatest=true
          tags: |
            type=raw,value=${{ matrix.device }},enable={{is_default_branch}}
            type=semver,pattern={{version}},enable={{is_semver}}
            type=semver,pattern={{major}}.{{minor}},enable={{is_semver}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          build-args: |
            DEVICE=${{ matrix.device }}
            EXPORT_MODEL=1
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.device }}
          cache-to: type=gha,mode=max,scope=${{ matrix.device }}
