# .github/workflows/build.yml
#
# Сборка и публикация Docker-образов в GHCR (GitHub Container Registry).
# На каждый push в main собираются оба варианта:
#   - ghcr.io/trahomich/acuity-yolo/worker:cpu      (onnxruntime, CPU-only)
#   - ghcr.io/trahomich/acuity-yolo/worker:rocm     (onnxruntime-rocm, AMD GPU)
#
# Образы публичные (чтобы сервер мог тянуть без docker login). Если нужно
# закрыть — в GitHub: репо → Packages → worker → Settings → Change visibility.
#
# Тегирование:
#   push в main     → worker:cpu / worker:rocm (rolling)
#   тег v*.*.*      → worker:cpu:<tag> / worker:rocm:<tag> + :<tag>
#   pull_request    → сборка без пуша (smoke-тест)
name: build

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        device: [cpu, gpu-amd]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        env:
          DEVICE: ${{ matrix.device }}
          OWNER: ${{ github.repository_owner }}
          REF: ${{ github.ref }}
        run: |
          # GHCR требует имя в нижнем регистре.
          owner="$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')"
          image="ghcr.io/${owner}/acuity-yolo/worker"
          echo "image=$image" >> "$GITHUB_OUTPUT"

          # Собираем список тегов (по одному на строку, склеим через \n).
          tags="${image}:${DEVICE}"
          if [[ "$REF" == refs/tags/v* ]]; then
            ver="${REF#refs/tags/v}"
            tags="${tags}\n${image}:${DEVICE}-${ver}"
            tags="${tags}\n${image}:${ver}-${DEVICE}"
          fi
          {
            echo "tags<<EOF"
            printf '%b\n' "$tags"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          build-args: |
            DEVICE=${{ matrix.device }}
            EXPORT_MODEL=1
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.device }}
          cache-to: type=gha,mode=max,scope=${{ matrix.device }}
