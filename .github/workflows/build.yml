# .github/workflows/build.yml
#
# Сборка и публикация Docker-образов в GHCR (GitHub Container Registry).
# Matrix: device (cpu, gpu-amd) × model (m, l, x). Каждый комбайн — отдельный тег:
#   ghcr.io/trahomich/acuity-yolo/worker:cpu-m
#   ghcr.io/trahomich/acuity-yolo/worker:cpu-l
#   ghcr.io/trahomich/acuity-yolo/worker:cpu-x
#   ghcr.io/trahomich/acuity-yolo/worker:gpu-amd-m
#   ghcr.io/trahomich/acuity-yolo/worker:gpu-amd-l
#   ghcr.io/trahomich/acuity-yolo/worker:gpu-amd-x
# Совместимость тегов: :cpu и :gpu-amd (без -model) указывают на -m для обратной
# совместимости со старыми deploy-конфигами.
#
# Образы публичные (сервер тянет без docker login).
#
# Переключение модели в deploy — просто смена тега образа, без пересборки:
#   image: ghcr.io/.../worker:gpu-amd-l
name: build

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        device: [cpu, gpu-amd]
        model: [m, l, x]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags and model spec
        id: meta
        env:
          DEVICE: ${{ matrix.device }}
          MODEL: ${{ matrix.model }}
          OWNER: ${{ github.repository_owner }}
          REF: ${{ github.ref }}
        run: |
          owner="$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')"
          image="ghcr.io/${owner}/acuity-yolo/worker"
          echo "image=$image" >> "$GITHUB_OUTPUT"

          # MODEL_SPEC для Dockerfile (export_model.py): yolo12m.pt / yolo12l.pt / ...
          echo "model_spec=yolo12${MODEL}.pt" >> "$GITHUB_OUTPUT"
          # Имя .onnx-файла, которое экспорт положит в models/
          echo "model_name=yolov12${MODEL}" >> "$GITHUB_OUTPUT"

          # Тег вида <device>-<model>, напр. gpu-amd-l. Плюс алиас <device>
          # (без модели) для модели m — обратная совместимость со старыми deploy.
          tags="${image}:${DEVICE}-${MODEL}"
          if [[ "$MODEL" == "m" ]]; then
            tags="${tags}\n${image}:${DEVICE}"
          fi
          if [[ "$REF" == refs/tags/v* ]]; then
            ver="${REF#refs/tags/v}"
            tags="${tags}\n${image}:${DEVICE}-${MODEL}-${ver}"
          fi
          {
            echo "tags<<EOF"
            printf '%b\n' "$tags"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          build-args: |
            DEVICE=${{ matrix.device }}
            EXPORT_MODEL=1
            MODEL_SPEC=${{ steps.meta.outputs.model_spec }}
            MODEL_NAME=${{ steps.meta.outputs.model_name }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          # Кэш раздельно по device (модели различаются только тонким слоем экспорта).
          cache-from: type=gha,scope=${{ matrix.device }}
          cache-to: type=gha,mode=max,scope=${{ matrix.device }}
