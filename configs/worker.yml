# configs/worker.yml — конфигурация inference-воркера acuity-yolo.
#
# Значения из этого файла — дефолты; переменные окружения имеют приоритет
# (см. app/config.py). В Docker переменные прокидываются через environment
# в docker-compose.yml.

worker:
  model_path: "models/yolov12m.onnx"
  execution_provider: "cpu"     # cpu | cuda | rocm | openvino | tensorrt
  conf_threshold: 0.4
  iou_threshold: 0.5
  input_size: 640
  model_name: "yolov12m"

  host: "0.0.0.0"
  port: 8000
  workers: 1                    # uvicorn-воркеров на процесс; для нагрузки
                                # поднимайте число реплик (docker compose up --scale)
  log_level: "info"
  max_image_bytes: 20971520     # 20 MiB
